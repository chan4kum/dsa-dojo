name: selftest
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python tools/lint_solutions.py
      - run: python dsa.py selftest
      - run: python tools/fuzz.py
      - run: python tools/fuzz_diff.py
      - run: python tools/verify_claims.py
      - run: python tools/build_notes.py && git diff --exit-code notes/
